# Publish Deployment logs to GH Pages

on:
  workflow_call:
    inputs:
      version:
        description: The version being deployed
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish-to-github-pages:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: gh-pages     # GH Pages branch
          persist-credentials: true
          fetch-depth: 1

      - name: Display deployment metadata
        run: |
          echo "Environment Name: ${{ github.event.deployment.environment }}"
          echo "Deployment state: ${{ github.event.deployment_status.state }}"
          # The creator of the original deployment request
          echo "Author/Triggered by: ${{ github.event.deployment.creator.login }}"
          # The user who created the specific status update (often a machine/bot)
          echo "Status Created by: ${{ github.event.deployment_status.creator.login }}"
          echo "Created Datetime: ${{ github.event.deployment_status.created_at }}"
          echo "Description: ${{ github.event.deployment_status.description }}"

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
