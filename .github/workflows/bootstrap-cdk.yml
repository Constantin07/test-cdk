name: Bootsrap CDK

on:
  workflow_dispatch:

env:
  python_version: 3.13
  working_directory: hello-cdk

concurrency:
  group: bootstrap-${{ github.head_ref || github.ref_name }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      AWS_REGION:: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup tooling
        uses: ./.github/actions/setup
        with:
          python_version: ${{ env.python_version }}
          working_directory: ${{ env.working_directory }}

      - name: Print CDK version
        run: npx aws-cdk --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE }}
          role-session-name: AssumeGitHubOIDCRole

      - name: Bootstrap CDK
        run: |
          cd hello-cdk
          npx cdk bootstrap aws://${{ vars.AWS_ACCOUNT }}/${{ vars.AWS_REGION }} --qualifier hello-app --ci
