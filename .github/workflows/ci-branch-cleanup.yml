# Clean up branch resources after PR is merged
name: CI branch cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - closed  # triggers for both 'closed' and 'merged' PRs

env:
  python_version: 3.13
  working_directory: hello-cdk

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

permissions:
  contents: read
  id-token: write
  actions: write # Allow to write cache

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    environment:
      name: dev-branch
      deployment: false
    env:
      AWS_REGION:: ${{ vars.AWS_REGION }}
    defaults:
      run:
        working-directory: ${{ env.working_directory }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Determine Stack prefix
        id: stack_prefix
        uses: ./.github/actions/get-prefix
        with:
          branch_name: ${{ github.event.pull_request.head.ref }}

      - name: Setup tooling
        uses: ./.github/actions/setup
        with:
          python_version: ${{ env.python_version }}
          working_directory: ${{ env.working_directory }}
          aws_region: ${{ vars.AWS_REGION }}
          role_to_assume: ${{ vars.AWS_OIDC_ROLE }}

      - name: List CDK Stacks
        run: |
          echo "### CDK list" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx cdk list --context stack_prefix=${{ steps.stack_prefix.outputs.prefix }} --ci --show-dependencies | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run CDK Destroy
        run: |
          set -euo pipefail

          # Stack to exclude (shared resources)
          STACKS_EXCLUDE_FILTER='(^NetworkStack|^DatabaseStack|^AppStack)'

          # Get all stacks (remove empty lines)
          mapfile -t STACKS < <(
            npx cdk list --context stack_prefix="${{ steps.stack_prefix.outputs.prefix }}" --ci | awk 'NF' | \
            { if [ -n "$STACKS_EXCLUDE_FILTER" ]; then grep -E -v "$STACKS_EXCLUDE_FILTER" || true; else cat; fi; }
          )
          echo "${STACKS[@]}"

          echo "### CDK destroy" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          for stack in "${STACKS[@]}"; do
            echo "::group::Destroying stack: $stack"
            npx cdk destroy --context stack_prefix="${{ steps.stack_prefix.outputs.prefix }}" "$stack" --ci --force | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
