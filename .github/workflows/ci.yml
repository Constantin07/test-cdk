name: CI pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

  workflow_dispatch:

env:
  python_version: 3.13
  working_directory: hello-cdk

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}

permissions: read-all

jobs:
  determine-version:
    uses: ./.github/workflows/determine-version.yml

  build:
    needs: [determine-version]
    runs-on: ubuntu-24.04
    outputs:
      stack_prefix: ${{ steps.stack_prefix.outputs.prefix }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Determine Stack prefix
        id: stack_prefix
        uses: ./.github/actions/get-prefix
        with:
          branch_name: ${{ github.head_ref || github.ref_name }}

      - name: Output the stack prefix
        run: |
          echo "The CDK branch stack prefix is ${{ steps.stack_prefix.outputs.prefix }}"
          echo "::notice title=CDK Stack prefix::CDK Stack prefix is ${{ steps.stack_prefix.outputs.prefix }}"

      - name: Build and run tests
        run: echo "Do some build and tests here. TODO"

  cdk-diff:
    needs: [build]
    if: >-
      ${{
        contains(github.event.pull_request.labels.*.name, 'deploy-infra') && github.ref != 'refs/heads/main' ||
        github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-24.04
    environment: dev-branch
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      AWS_REGION:: ${{ vars.AWS_REGION }}
    defaults:
      run:
        working-directory: ${{ env.working_directory }}
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup tooling
        uses: ./.github/actions/setup
        with:
          python_version: ${{ env.python_version }}
          working_directory: ${{ env.working_directory }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE }}
          role-session-name: AssumeGitHubOIDCRole

      - name: Synth CDK stacks
        run: npx cdk synth --context stack_prefix=${{ needs.build.outputs.stack_prefix }} --ci

      - name: Plan CDK Deploy to AWS
        id: diff
        run: |
          set +e
          npx cdk diff --context stack_prefix=${{ needs.build.outputs.stack_prefix }} --ci --all --fail --quiet 2>&1 | tee cdk.diff
          RC=${PIPESTATUS[0]}
          echo "cdk diff exit code: $RC"

          if [[ $RC -eq 0 ]]; then
            echo "No changes found"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ $RC -eq 1 ]]; then
            # 1 usually means "diff found", but can be other errors.
            if grep -E "Number of stacks with differences:|^\s*\[\+|\[\~|\[\-\]" cdk.diff >/dev/null; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "Unexpected CDK error:"
              cat cdk.diff
              exit 2
            fi
          else
            # Any other non-zero is a real error
            exit $RC
          fi

      - name: Update Summary
        id: diff_summary
        run: |
          echo "### CDK diff" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat cdk.diff >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post CDK diff output in PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Read diff file contents
            const fs = require('fs');
            process.chdir(process.env.working_directory);
            const content = fs.readFileSync('cdk.diff', { encoding: 'utf8', flag: 'r' });

            // Retrieve existing bot comments for the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Find and delete all previous bot comments so PR timeline is kept clean
            for (const comment of comments) {
              if (comment.user.type === 'Bot' && comment.body.includes('CDK diff')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            const output = `#### CDK diff 📖\`${{ steps.diff_summary.outcome }}\`

            <details><summary>Show CDK diff for Deployment: </summary>

            \`\`\`\n
            ${content}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  cdk-deploy:
    needs: [build, cdk-diff]
    if: ${{ needs.cdk-diff.outputs.has_changes == 'true' }}
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'dev' || 'dev-branch' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION:: ${{ vars.AWS_REGION }}
    defaults:
      run:
        working-directory: ${{ env.working_directory }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup tooling
        uses: ./.github/actions/setup
        with:
          python_version: ${{ env.python_version }}
          working_directory: ${{ env.working_directory }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_OIDC_ROLE }}
          role-session-name: AssumeGitHubOIDCRole

      - name: Run CDK Deploy
        run: |
          echo "### CDK deploy" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx cdk deploy --context stack_prefix=${{ needs.build.outputs.stack_prefix }} --ci --all --require-approval=never 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> $GITHUB_STEP_SUMMARY

  run-tests:
    needs: [build, cdk-diff, cdk-deploy]
    if: ${{ !cancelled() && needs.cdk-diff.result == 'success' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.working_directory }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Run some tests
        run: echo "Run some E2E tests against deployed resources. TODO"

      - name: Dump refs
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "base_ref=${{ github.base_ref }}"

  release:
    needs: [determine-version, run-tests]
    # if: ${{ github.ref == 'refs/heads/main' && needs.run-tests.result == 'success' }}
    if: ${{ needs.run-tests.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch full history to include tags

      - name: Get new tag
        run: echo "NEW_TAG=${{ needs.determine-version.outputs.next_version }}" >> $GITHUB_ENV

      - name: Set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push Release Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "$NEW_TAG"
          git push origin tag "$NEW_TAG"
