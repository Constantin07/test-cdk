version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions

  # Maintain dependencies for Node.js
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - nodejs

  # Maintain dependencies for Python
  - package-ecosystem: pip
    directory: hello-cdk/
    schedule:
      interval: weekly
    allow:
      - dependency-type: "all"  # includes dev deps too
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python
