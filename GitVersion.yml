---
workflow: GitHubFlow/v1
mode: ContinuousDeployment
branches:
  main:
    regex: ^main$
    is-release-branch: true
    label: '' # stable on main
  pull-request:
    # Match "pull/14/merge" (and also "pull/14/head")
    regex: ^pull\/(?<Number>\d+)\/(merge|head)$
    label: PullRequest{Number}
    mode: ContinuousDeployment
    increment: Patch
